<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/style.css">
        <title>Acceuil Robbie Lens Photographie</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
<body>
    <header>
        <nav>
            <div class="logo_header" >
                <img src="images/logo.png" alt="Logo Robbie Lens">
            </div>
            <div class="lien_header">
                <a class="lien_index" href="index.html">Accueil</a>
                <a class="lien_a_propos" href="a-propos.html">À propos</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="texte_acceuil">
            <div class="presentation">
                <h1>Robbie Lens Photographie</h1>

                <p>
                    Où <em class="important"> professionalisme </em> s’allie avec <em class="important"> passion </em>. Depuis plus de 5 ans maintenant, j’exerce mon métier avec la passion
                    qui m’anime : capturer l’essence de chaque instant.
                </p>
                <div>
                    <a class="degrade_lien" href="">UN PROJET ? ÉCRIVEZ-MOI</a>
                </div>
            </div>
            <div class="photo_robbie">
                <img src="images/robbie-lens.png" alt="Portrait de la photographe Robbie Lens">
            </div>
        </section>
        <section class="projet">
            <h2>Mon dernier projet</h2>
            <div class="div_photos">
                <img src="images/photos/element-1.png" alt="Photo de projet 1">
                <img src="images/photos/element-2.png" alt="Photo de projet 2">
                <img src="images/photos/element-3.png" alt="Photo de projet 3">
                <img src="images/photos/element-4.png" alt="Photo de projet 4">
                <img src="images/photos/element-5.png" alt="Photo de projet 5">
                <img src="images/photos/element-6.png" alt="Photo de projet 6">
            </div>
        </section>
        
    </main>
    <footer class="pied_de_page">
            <img src="images/logo.png" alt="Logo Robbie Lens">
            <a target="_blank" href="https://twitter.com/">
                <img class="lien_icone" src="images/twitter.png" alt="Logo Twitter">
            </a>
            <a target="_blank" href="https://www.instagram.com/">
                <img class="lien_icone" src="images/instagram.png" alt="Logo Instagram">
            </a>
    </footer>

</html>
